services:
  - type: web
    name: sih-26085-urban-flood-nowcasting
    runtime: python
    region: singapore
    plan: free
    branch: backend-work
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENWEATHER_API_KEY
        sync: false
      - key: PORT
        value: 8000
