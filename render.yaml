services:
  - type: web
    name: sih-26085-urban-flood-nowcasting
    runtime: python
    region: singapore
    plan: free
    branch: main
    buildCommand: pip install -r requirements-deploy.txt
    startCommand: python scripts/start_production.py
    healthCheckPath: /health
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENV
        value: production
      - key: ALLOW_SQLITE_FALLBACK
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: MUNICIPAL_API_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        value: ""
      - key: FORECAST_ASSETS_PATH
        value: /tmp/urban-flood/runs
      - key: RAINFALL_STORE_PATH
        value: /tmp/urban-flood/rainfall
      - key: PYTHONUNBUFFERED
        value: "1"
